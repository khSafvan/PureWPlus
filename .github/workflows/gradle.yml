name: Java CI

on: [push]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 8 (Zulu with JavaFX)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'
        java-package: 'jdk+fx'
        architecture: x64
    - name: Run contract tests
      run: ./gradlew test
    - name: Build with jfxNative
      run: ./gradlew jfxNative --scan
