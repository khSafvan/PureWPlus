name: Java CI

on: [push]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Set up JDK 8 (Zulu with JavaFX)
      uses: actions/setup-java@8df10395026330e121be63d800793f23f3b99ea7 # v4.4.0
      with:
        distribution: 'zulu'
        java-version: '8'
        java-package: 'jdk+fx'
        architecture: x64
    - name: Run contract tests
      run: ./gradlew test
    - name: Build with jfxNative
      run: ./gradlew jfxNative --scan
